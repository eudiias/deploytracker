global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Coleta de métricas internas do Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # Coleta de métricas de hardware/SO do Host
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Coleta de métricas de contêineres Docker via cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Coleta de métricas internas do Loki
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Coleta de métricas internas do Promtail
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']

