apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 2000
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "container=([a-zA-Z0-9_-]+)"
          name: ContainerMetrics
          url: "container_cpu_usage_seconds_total{name=\"$${__value.raw}\"}"

